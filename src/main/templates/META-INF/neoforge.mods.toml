modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL="https://github.com/Metallurgists-of-Create/Create-Ore-Excavation/issues"
[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
updateJSONURL="https://raw.githubusercontent.com/Metallurgists-of-Create/Create-Ore-Excavation/main/version-check.json"
displayURL="https://www.curseforge.com/minecraft/mc-mods/create-ore-excavation"
logoFile="createoreexcavation.png"
credits="${mod_credits}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config = "${mod_id}.mixins.json"
[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies."${mod_id}"]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies."${mod_id}"]]
    modId="create"
    type="required"
    versionRange="[6.0.6,)"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="kubejs"
    type="optional"
    versionRange="[2101.7.2-build.377,)"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="kubejs_create"
    type="optional"
    versionRange="[2101.3.1-build.14,)"
    ordering="NONE"
    side="BOTH"
